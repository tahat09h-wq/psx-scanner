name: GridPulse Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Har 5 ghantay baad auto-restart ho ga taaky bot chalta rahay

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
